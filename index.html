
<!DOCTYPE html>
<html lang="de">
<head>

<title>Frag mich</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7ff;

  color: #202124;
}
main {
  padding: 100px 20px 20px;
}

  font-size: 48px;
  color: #536dfe;
}

}

}

  margin: 15px 5px;
  padding: 14px 25px;

<body>
<main>
<h1>Frag mich</h1>

placeholder="Stelle deine Frage..." required>
